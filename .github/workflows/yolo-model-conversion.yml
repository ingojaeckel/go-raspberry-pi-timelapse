name: YOLO Model Conversion Validation

on:
  workflow_dispatch:
    inputs:
      yolo_version:
        description: 'YOLO version to test (9, 10, or 11)'
        required: true
        type: choice
        options:
          - '9'
          - '10'
          - '11'
        default: '11'
      model_size:
        description: 'Model size to test'
        required: true
        type: choice
        options:
          - 'n'
          - 's'
          - 'm'
          - 'l'
          - 'x'
        default: 'n'
  push:
    paths:
      - 'cpp-object-detection/scripts/convert_yolo_to_onnx.py'
      - '.github/workflows/yolo-model-conversion.yml'

permissions:
  contents: read

jobs:
  convert-and-validate:
    name: Convert and Validate YOLO Model
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ultralytics onnx onnxruntime

      - name: Set model parameters
        id: model
        run: |
          # Use workflow inputs if available (workflow_dispatch), otherwise use defaults
          if [ -n "${{ github.event.inputs.yolo_version }}" ]; then
            VERSION="${{ github.event.inputs.yolo_version }}"
            SIZE="${{ github.event.inputs.model_size }}"
          else
            # Default values for push events
            VERSION="11"
            SIZE="n"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "size=${SIZE}" >> $GITHUB_OUTPUT
          echo "name=yolo${VERSION}${SIZE}" >> $GITHUB_OUTPUT

      - name: Convert model to ONNX
        working-directory: cpp-object-detection
        run: |
          echo "Converting YOLO v${{ steps.model.outputs.version }} size ${{ steps.model.outputs.size }} to ONNX..."
          python scripts/convert_yolo_to_onnx.py \
            --version ${{ steps.model.outputs.version }} \
            --model-size ${{ steps.model.outputs.size }} \
            --output-dir models \
            --verbose

      - name: Verify ONNX file exists
        working-directory: cpp-object-detection
        run: |
          MODEL_FILE="models/${{ steps.model.outputs.name }}.onnx"
          if [ ! -f "$MODEL_FILE" ]; then
            echo "Error: ONNX file not created at $MODEL_FILE"
            exit 1
          fi
          
          echo "✓ ONNX file created successfully"
          ls -lh "$MODEL_FILE"
          
          # Check file size (should be > 1MB for valid model)
          FILE_SIZE=$(stat -c%s "$MODEL_FILE" 2>/dev/null || stat -f%z "$MODEL_FILE")
          if [ "$FILE_SIZE" -lt 1000000 ]; then
            echo "Error: ONNX file seems too small ($FILE_SIZE bytes)"
            exit 1
          fi
          echo "✓ File size check passed: $FILE_SIZE bytes"

      - name: Validate ONNX model with Python
        working-directory: cpp-object-detection
        run: |
          python - << 'EOF'
import onnx
import sys

model_path = "models/${{ steps.model.outputs.name }}.onnx"
print(f"Loading ONNX model: {model_path}")

try:
    model = onnx.load(model_path)
    onnx.checker.check_model(model)
    print("✓ ONNX model validation passed")
    
    # Print model info
    print(f"\nModel Information:")
    print(f"  Producer: {model.producer_name}")
    print(f"  ONNX version: {model.opset_import[0].version}")
    
    # Print input/output info
    print(f"\n  Inputs:")
    for inp in model.graph.input:
        shape = [dim.dim_value for dim in inp.type.tensor_type.shape.dim]
        print(f"    {inp.name}: {shape}")
    
    print(f"\n  Outputs:")
    for out in model.graph.output:
        shape = [dim.dim_value for dim in out.type.tensor_type.shape.dim]
        print(f"    {out.name}: {shape}")
    
except Exception as e:
    print(f"Error validating ONNX model: {e}", file=sys.stderr)
    sys.exit(1)
EOF

      - name: Test ONNX inference with ONNXRuntime
        working-directory: cpp-object-detection
        run: |
          python - << 'EOF'
import onnxruntime as ort
import numpy as np
import sys

model_path = "models/${{ steps.model.outputs.name }}.onnx"
print(f"Testing inference with ONNX Runtime: {model_path}")

try:
    # Create inference session
    session = ort.InferenceSession(model_path, providers=['CPUExecutionProvider'])
    
    # Get input details
    input_name = session.get_inputs()[0].name
    input_shape = session.get_inputs()[0].shape
    print(f"✓ Loaded model successfully")
    print(f"  Input: {input_name} {input_shape}")
    
    # Create dummy input
    # YOLO models typically expect [batch, channels, height, width]
    dummy_input = np.random.randn(*input_shape).astype(np.float32)
    
    # Run inference
    outputs = session.run(None, {input_name: dummy_input})
    print(f"✓ Inference test passed")
    print(f"  Output shapes: {[out.shape for out in outputs]}")
    
except Exception as e:
    print(f"Error during inference test: {e}", file=sys.stderr)
    sys.exit(1)
EOF

      - name: Upload converted model as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.model.outputs.name }}-onnx-${{ matrix.platform }}
          path: cpp-object-detection/models/${{ steps.model.outputs.name }}.onnx
          retention-days: 7

  conversion-summary:
    name: Conversion Summary
    needs: convert-and-validate
    runs-on: ubuntu-latest
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        
      - name: Generate summary
        run: |
          echo "## YOLO Model Conversion Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✓ Successfully converted YOLO model to ONNX format" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -n "${{ github.event.inputs.yolo_version }}" ]; then
            echo "**Model:** YOLO v${{ github.event.inputs.yolo_version }}${{ github.event.inputs.model_size }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Model:** YOLO v11n (default)" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "**Platforms tested:** Linux (AMD64), macOS (x86_64)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The converted ONNX models are available as workflow artifacts:" >> $GITHUB_STEP_SUMMARY
          
          # List artifact files
          echo '```' >> $GITHUB_STEP_SUMMARY
          find . -name "*.onnx" -exec ls -lh {} \; >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
