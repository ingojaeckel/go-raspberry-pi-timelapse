name: Pi image
# Builds the SD card image (make image) on demand and for every tag. A tag
# also publishes the zipped image as a GitHub release asset.
on:
  workflow_dispatch:
  push:
    tags: ['*']
permissions:
  contents: read
jobs:
  image:
    name: Build image
    # arm64 runner; 32-bit ARM code in the image runs through qemu.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # git describe names the image after the latest tag
    - uses: actions/setup-node@v4
      with:
        node-version-file: src/frontend/.nvmrc
    - uses: actions/setup-go@v5
      with:
        go-version-file: src/backend/go.mod
    # CustomPiOS needs the kernel to run 32-bit ARM programs (binfmt_misc).
    - uses: docker/setup-qemu-action@v3
      with:
        platforms: arm
    - name: Base image cache key
      id: base
      run: echo "sha=$(sed -n 's/^TIMELAPSEPI_BASE_IMAGE_SHA256=//p' src/installer/custompios/config)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      with:
        path: src/installer/custompios/image
        key: base-image-${{ steps.base.outputs.sha }}
    - run: sudo modprobe loop
    # Tests, Pi build, then CustomPiOS in Docker (src/installer/custompios/build-image.sh).
    - run: make image
    - name: Disk usage
      if: always()
      run: df -h
    - uses: actions/upload-artifact@v4
      with:
        name: timelapsepi-image
        path: src/installer/custompios/workspace/*.zip
        compression-level: 0 # already zipped
        # ~0.9 GB; the release job picks it up right away. Keeps Actions
        # storage (500 MB on GitHub Free) from filling up with old images.
        retention-days: 1

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/')
    needs: image
    runs-on: ubuntu-latest
    # Only this job, which runs no project code, can write releases.
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: timelapsepi-image
    - env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
        gh release upload "$GITHUB_REF_NAME" ./*.zip --clobber
