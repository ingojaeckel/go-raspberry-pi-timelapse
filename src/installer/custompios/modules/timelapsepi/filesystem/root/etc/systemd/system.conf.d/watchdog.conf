# Reboot the Pi when the kernel or systemd itself hangs, using the SoC's
# hardware watchdog (bcm2835_wdt, /dev/watchdog). systemd pings it; its
# maximum timeout is about 15 seconds. timelapse.service has its own,
# per-service watchdog for the app.
[Manager]
RuntimeWatchdogSec=15
RebootWatchdogSec=2min
